x-spark: &spark
  build: .
  working_dir: /app
  environment:
    PYTHONPATH: /app/src
  volumes:
    - ./src:/app/src
    - ./data:/app/data

services:
  ingest:
    <<: *spark
    command: python src/ingest.py

  exercise2:
    <<: *spark
    command: python src/exercise2.py

  exercise3:
    <<: *spark
    command: python src/exercise3.py
    environment:
      PYTHONPATH: /app/src
      FORECAST_HORIZON_DAYS: ${FORECAST_HORIZON_DAYS:-90}

  solve:
    <<: *spark
    command: >
      sh -c "python src/exercise2.py &&
             FORECAST_METRIC=avg_duration_minutes FORECAST_HORIZON_DAYS=30 python src/exercise3.py &&
             FORECAST_METRIC=session_count FORECAST_HORIZON_DAYS=30 python src/exercise3.py"
