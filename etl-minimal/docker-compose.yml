x-spark: &spark
  build: .
  working_dir: /app
  environment:
    PYTHONPATH: /app/src
  volumes:
    - ./src:/app/src
    - ./data:/app/data

services:
  ingest:
    <<: *spark
    command: python src/ingest.py

  exercise2:
    <<: *spark
    command: python src/exercise2.py

  exercise3:
    <<: *spark
    command: python src/exercise3.py

  all:
    <<: *spark
    command: >
      sh -c "python src/ingest.py &&
             python src/exercise2.py &&
             python src/exercise3.py"
